services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.1-ce.0
    hostname: gitlab
    restart: "no"
    shm_size: "256m"
    ports:
      - "${VCS_GITLAB_TEST_PORT:-8929}:${VCS_GITLAB_TEST_PORT:-8929}"
      - "${VCS_GITLAB_TEST_SSH_PORT:-2224}:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${VCS_GITLAB_TEST_PORT:-8929}'
        gitlab_rails['initial_root_password'] = 'Zq7!vT2#pL9@xR4$'
        gitlab_rails['gitlab_shell_ssh_port'] = ${VCS_GITLAB_TEST_SSH_PORT:-2224}
        puma['worker_processes'] = 0
        sidekiq['max_concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
        gitlab_rails['gitlab_email_enabled'] = false
        gitlab_rails['smtp_enable'] = false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${VCS_GITLAB_TEST_PORT:-8929}/-/readiness?all=1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 120s
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
