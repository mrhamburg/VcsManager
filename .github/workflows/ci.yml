name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Check formatting
      run: dotnet format --verify-no-changes --no-restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run unit tests with coverage
      run: >-
        dotnet test
        --no-build
        -c Release
        --collect:"XPlat Code Coverage"
        --results-directory ./test-results

    - name: Upload coverage
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage
        path: ./test-results/**/coverage.cobertura.xml
        retention-days: 7

    - name: Pack NuGet packages
      run: dotnet pack --no-build -c Release --output ./nupkg

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          ./nupkg/*.nupkg
          ./nupkg/*.snupkg
        retention-days: 7

  integration-gitea:
    name: Integration tests (Gitea)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    services:
      gitea:
        image: gitea/gitea:28.2.0
        env:
          GITEA__database__DB_TYPE: sqlite3
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__service__DISABLE_REGISTRATION: "true"
          GITEA__server__ROOT_URL: http://localhost:3000/
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -fsS http://localhost:3000/api/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v7

    - name: Provision Gitea test user
      id: gitea
      shell: bash
      run: |
        set -euo pipefail

        container="${{ job.services.gitea.id }}"

        docker exec -u git "$container" \
          gitea admin user create \
          --username ci \
          --random-password \
          --email ci@example.com \
          --admin \
          --must-change-password=false >/dev/null

        token="$(docker exec -u git "$container" \
          gitea admin user generate-access-token \
          --username ci \
          --token-name ci-integration \
          --scopes all \
          --raw)"

        if [ -z "$token" ]; then
          echo "Gitea did not return an access token." >&2
          exit 1
        fi

        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Run Gitea integration tests
      uses: ./.github/actions/integration-test
      with:
        config: |
          provider:
            gitea:
              base:
                url: http://localhost:3000
              token: "${{ steps.gitea.outputs.token }}"
              default:
                owner: ci

  integration-github:
    name: Integration tests (GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    if: vars.HAS_GITHUB_SECRETS == 'true'

    steps:
    - uses: actions/checkout@v7

    - name: Run GitHub integration tests
      uses: ./.github/actions/integration-test
      with:
        config: |
          provider:
            github:
              token: "${{ secrets.VCS_GITHUB_TEST_TOKEN }}"
              base:
                url: "${{ vars.VCS_GITHUB_TEST_URL }}"
              default:
                owner: "${{ vars.VCS_GITHUB_TEST_OWNER }}"

  integration-gitlab:
    name: Integration tests (GitLab)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    if: vars.HAS_GITLAB_SECRETS == 'true'

    steps:
    - uses: actions/checkout@v7

    - name: Run GitLab integration tests
      uses: ./.github/actions/integration-test
      with:
        config: |
          provider:
            gitlab:
              token: "${{ secrets.VCS_GITLAB_TEST_TOKEN }}"
              base:
                url: "${{ vars.VCS_GITLAB_TEST_URL }}"
              default:
                namespace: "${{ vars.VCS_GITLAB_TEST_NAMESPACE }}"

  integration-azure-devops:
    name: Integration tests (Azure DevOps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    if: vars.HAS_AZURE_DEVOPS_SECRETS == 'true'

    steps:
    - uses: actions/checkout@v7

    - name: Run Azure DevOps integration tests
      uses: ./.github/actions/integration-test
      with:
        config: |
          provider:
            azuredevops:
              organization:
                url: "${{ secrets.VCS_AZURE_DEVOPS_ORG_URL }}"
              personal:
                access:
                  token: "${{ secrets.VCS_AZURE_DEVOPS_TOKEN }}"
              default:
                project: "${{ vars.VCS_AZURE_DEVOPS_PROJECT }}"
