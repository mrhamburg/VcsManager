name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore

    - name: Check formatting
      run: dotnet format --verify-no-changes --no-restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run unit tests with coverage
      run: >-
        dotnet test
        --no-build
        -c Release
        --filter "FullyQualifiedName!~IntegrationTests"
        --collect:"XPlat Code Coverage"
        --results-directory ./test-results

    - name: Pack NuGet packages
      run: dotnet pack --no-build -c Release --output ./nupkg

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./nupkg/*.nupkg
        retention-days: 7

  integration-tests:
    name: Integration tests (Gitea)
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      gitea:
        image: gitea/gitea:28.2.0
        env:
          GITEA__database__DB_TYPE: sqlite3
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__service__DISABLE_REGISTRATION: "true"
          GITEA__server__ROOT_URL: http://localhost:3000/
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -fsS http://localhost:3000/api/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Provision Gitea test user
      id: gitea
      shell: bash
      run: |
        set -euo pipefail

        container="${{ job.services.gitea.id }}"

        docker exec -u git "$container" \
          gitea admin user create \
          --username ci \
          --random-password \
          --email ci@example.com \
          --admin \
          --must-change-password=false >/dev/null

        token="$(docker exec -u git "$container" \
          gitea admin user generate-access-token \
          --username ci \
          --token-name ci-integration \
          --scopes all \
          --raw)"

        if [ -z "$token" ]; then
          echo "Gitea did not return an access token." >&2
          exit 1
        fi

        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Run Gitea integration tests
      env:
        VCS_GITEA_TEST_URL: http://localhost:3000
        VCS_GITEA_TEST_TOKEN: ${{ steps.gitea.outputs.token }}
      run: >-
        dotnet test
        tests/VcsManager.IntegrationTests/VcsManager.IntegrationTests.csproj
        -c Release
